
images:
  meta:
    registry:
      default: docker.io
      mirror:
        enable: yes
        url: registry.test.pensando.io:5000
    operator: gpu-operator
    version: v1.4.1
  k8:
    driver:
      key: driver.image
      kind: container

    gpu-operator:
      location: repo://rocm.github.io/gpu-operator:gpu-operator-charts
      version: v1.4.1
      kind: helm-chart

    gpu-controller-manager:
      key: controllerManager.manager.image
      location: container://<registry>/rocm/gpu-operator
      version: v1.4.1
      kind: container

    exporter:
      image: file:///device-metrics-exporter/helm-charts/device-metrics-exporter-charts.tgz
      kind: helm-chart
      version: v1.4.2

    device-metrics-exporter:
      key: metricsExporter.image
      image: file:///device-metrics-exporter/docker/device-metrics-exporter-latest.tar.gz
      kind: container

    test-runner:
      key: testRunner.image
      location: container://<registry>/rocm/test-runner
      version: v1.4.1
      kind: container

    test-runner-agfhc:
      key: testRunnerAgfhc.image
      location: container://<registry>/rocm/test-runner
      version: agfhc-v1.4.1
      kind: container

    config-manager:
      key: configManager.image
      location: container://<registry>/rocm/device-config-manager
      version: v1.4.1
      kind: container

    device-plugin:
      key: devicePlugin.devicePluginImage
      location: container://<registry>/rocm/k8s-device-plugin
      version: latest
      kind: container

    node-labeller:
      key: devicePlugin.nodeLabellerImage
      location: container://<registry>/rocm/k8s-device-plugin
      version: labeller-latest
      kind: container

    kmm-controller-manager-image-sign:
      key: kmm.controller.manager.env.relatedImageSign
      location: container://<registry>/rocm/kernel-module-management-signimage
      version: v1.4.1
      kind: container

    kmm-controller-manager-worker:
      key: kmm.controller.manager.env.relatedImageWorker
      location: container://<registry>/rocm/kernel-module-management-worker
      version: v1.4.1
      kind: container

    kmm-controller-manager:
      key: kmm.controller.manager.image
      location: container://<registry>/rocm/kernel-module-management-operator
      version: v1.4.1
      kind: container

    kmm-webhook-server:
      key: kmm.webhookServer.webhookServer.image
      location: container://<registry>/rocm/kernel-module-management-webhook-server
      version: v1.4.1
      kind: container

    init-container-image:
      key: commonConfig.initContainerImage
      location: container://registry.test.pensando.io:5000/busybox
      version: 1.36
      kind: container

  openshift:
    driver:
      key: driver.image
      location: container://image-registry.openshift-image-registry.svc:5000/openshift-amd-gpu/amdgpu_kmod
      kind: container

    gpu-operator:
      image: container://docker.io/amdpsdo/gpu-operator-olm-bundle
      metadata: file:///gpu-operator/artifacts.metadata
      kind: olm-bundle
      version: v1.4.1
      secret: docker-amdpsdo-auth

    device-metrics-exporter:
      key: metricsExporter.image
      image: file:///device-metrics-exporter/docker/device-metrics-exporter-latest.tar.gz
      metadata: file:///device-metrics-exporter/docker/device-metrics-exporter-latest.metadata
      kind: container

    test-runner:
      key: testRunner.image
      location: container://<registry>/rocm/test-runner
      version: v1.4.1
      kind: container

    test-runner-agfhc:
      key: testRunnerAgfhc.image
      location: container://<registry>/rocm/test-runner
      version: agfhc-v1.4.1
      kind: container

    config-manager:
      key: configManager.image
      location: container://<registry>/rocm/device-config-manager
      version: v1.4.1
      kind: container

    device-plugin:
      key: devicePlugin.devicePluginImage
      location: container://<registry>/rocm/k8s-device-plugin
      version: latest
      kind: container

    node-labeller:
      key: devicePlugin.nodeLabellerImage
      location: container://<registry>/rocm/k8s-device-plugin
      version: labeller-latest
      kind: container

    init-container-image:
      key: commonConfig.initContainerImage
      location: container://<registry>/busybox
      version: 1.36
      kind: container

    tensorflow-image:
      key: workload.tensorflow
      location: container://registry.test.pensando.io:5000/rocm/tensorflow
      version: latest
      kind: container

    pytorch-image:
      key: workload.pytorch
      location: container://docker.io/rocm/pytorch
      version: latest
      kind: container

  standalone:
    driver:
      key: driver.image
      kind: container

    gpu-operator:
      location: repo://rocm.github.io/gpu-operator:gpu-operator-charts
      version: v1.4.1
      kind: helm-chart

    gpu-controller-manager:
      key: controllerManager.manager.image
      location: container://<registry>/rocm/gpu-operator
      version: v1.4.1
      kind: container

    exporter:
      image: file:///device-metrics-exporter/helm-charts/device-metrics-exporter-charts.tgz
      kind: helm-chart
      version: v1.4.2

    device-metrics-exporter:
      key: metricsExporter.image
      image: file:///device-metrics-exporter/docker/device-metrics-exporter-latest.tar.gz
      kind: container

    exporter-debian-Ubuntu-22.04:
      image: file:///device-metrics-exporter/bin/amdgpu-exporter_22.04_amd64.deb
      kind: debian
      version: v1.4.2

    exporter-debian-Ubuntu-24.04:
      image: file:///device-metrics-exporter/bin/amdgpu-exporter_24.04_amd64.deb
      kind: debian
      version: v1.4.2

    device-plugin:
      key: devicePlugin.devicePluginImage
      location: container://<registry>/rocm/k8s-device-plugin
      version: latest
      kind: container

    node-labeller:
      key: devicePlugin.nodeLabellerImage
      location: container://<registry>/rocm/k8s-device-plugin
      version: labeller-latest
      kind: container

    kmm-controller-manager-image-sign:
      key: kmm.controller.manager.env.relatedImageSign
      location: container://<registry>/rocm/kernel-module-management-signimage
      version: v1.4.1
      kind: container

    kmm-controller-manager-worker:
      key: kmm.controller.manager.env.relatedImageWorker
      location: container://<registry>/rocm/kernel-module-management-worker
      version: v1.4.1
      kind: container

    kmm-controller-manager:
      key: kmm.controller.manager.image
      location: container://<registry>/rocm/kernel-module-management-operator
      version: v1.4.1
      kind: container

    kmm-webhook-server:
      key: kmm.webhookServer.webhookServer.image
      location: container://<registry>/rocm/kernel-module-management-webhook-server
      version: v1.4.1
      kind: container

    init-container-image:
      key: commonConfig.initContainerImage
      location: container://registry.test.pensando.io:5000/busybox
      version: 1.36
      kind: container

