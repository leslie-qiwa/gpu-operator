kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  DynamicResourceAllocation: true
containerdConfigPatches:
  - |
    [plugins."io.containerd.grpc.v1.cri".registry.configs."registry.test.pensando.io:5000".tls]
      insecure_skip_verify = true
  - |
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry.test.pensando.io:5000"]
      endpoint = ["http://registry.test.pensando.io:5000"]
  - |
    [plugins."io.containerd.grpc.v1.cri".registry.configs."registry.local:5000".tls]
      insecure_skip_verify = true
  - |
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry.local:5000"]
      endpoint = ["http://registry.local:5000"]
  - |
    [plugins."io.containerd.grpc.v1.cri".registry.configs."registry-replaceme:5000".tls]
      insecure_skip_verify = true
  - |
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry-replaceme:5000"]
      endpoint = ["http://registry-replaceme:5000"]
  - |
    [plugins."io.containerd.grpc.v1.cri".containerd]
      snapshotter = "native"
  - |
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
      SystemdCgroup = false
nodes:
  - role: control-plane
    image: registry.test.pensando.io:5000/kindest-node:v1.32.0
    extraMounts:
      - hostPath: /sys/module
        containerPath: /sys/module
      - hostPath: /run/dbus/system_bus_socket
        containerPath: /run/dbus/system_bus_socket
    # Configure Kubelet to use cgroup v1
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            runtime-config: "resource.k8s.io/v1beta1=true"
        scheduler:
            extraArgs:
              v: "1"
        controllerManager:
            extraArgs:
              v: "1"
      - |
        kind: KubeletConfiguration
        apiVersion: kubelet.config.k8s.io/v1beta1
        cgroupDriver: "cgroupfs"
  - role: worker
    image: registry.test.pensando.io:5000/kindest-node:v1.32.0
    extraMounts:
      - hostPath: /sys/module
        containerPath: /sys/module
      - hostPath: /run/dbus/system_bus_socket
        containerPath: /run/dbus/system_bus_socket
    # Configure Kubelet to use cgroup v1
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        apiVersion: kubelet.config.k8s.io/v1beta1
        cgroupDriver: "cgroupfs"
  - role: worker
    image: registry.test.pensando.io:5000/kindest-node:v1.32.0
    extraMounts:
      - hostPath: /sys/module
        containerPath: /sys/module
      - hostPath: /run/dbus/system_bus_socket
        containerPath: /run/dbus/system_bus_socket
    # Configure Kubelet to use cgroup v1
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        apiVersion: kubelet.config.k8s.io/v1beta1
        cgroupDriver: "cgroupfs"
