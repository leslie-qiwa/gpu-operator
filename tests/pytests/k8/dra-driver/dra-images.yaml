---

images:
    meta:
        registry:
            default: docker.io
            mirror:
                enable: no
                url: registry.test.pensando.io:5000
    k8:
        driver:
            key         : driver.image
            location    : container://registry.test.pensando.io:5000/amdgpu_kmod
            kind        : container

        gpu-operator:
            location    : repo://rocm.github.io/gpu-operator:gpu-operator-charts
            version     : v1.4.1
            kind        : helm-chart

        gpu-controller-manager:
            key         : controllerManager.manager.image
            location    : container://<registry>/rocm/gpu-operator
            version     : v1.4.1
            kind        : container

        exporter:
            location    : repo://rocm.github.io/device-metrics-exporter:device-metrics-exporter-charts
            version     : v1.4.1
            kind        : helm-chart

        device-metrics-exporter:
            key         : metricsExporter.image
            location    : container://<registry>/rocm/device-metrics-exporter
            version     : v1.4.1
            kind        : container

        test-runner:
            key         : testRunner.image
            location    : container://<registry>/rocm/test-runner
            version     : v1.4.1
            kind        : container

        test-runner-agfhc:
            key         : testRunnerAgfhc.image
            location    : container://<registry>/rocm/test-runner
            version     : agfhc-v1.4.1
            kind        : container

        config-manager:
            key         : configManager.image
            location    : container://<registry>/rocm/device-config-manager
            version     : v1.4.1
            kind        : container
        
        device-plugin:
            key         : devicePlugin.devicePluginImage
            location    : container://<registry>/rocm/k8s-device-plugin
            version     : latest
            kind        : container

        node-labeller:
            key         : devicePlugin.nodeLabellerImage
            location    : container://<registry>/rocm/k8s-device-plugin
            version     : labeller-latest
            kind        : container

        kmm-controller-manager-image-sign:
            key         : kmm.controller.manager.env.relatedImageSign
            location    : container://<registry>/rocm/kernel-module-management-signimage
            version     : v1.4.1
            kind        : container

        kmm-controller-manager-worker:
            key         : kmm.controller.manager.env.relatedImageWorker
            location    : container://<registry>/rocm/kernel-module-management-worker
            version     : v1.4.1
            kind        : container

        kmm-controller-manager:
            key         : kmm.controller.manager.image
            location    : container://<registry>/rocm/kernel-module-management-operator
            version     : v1.4.1
            kind        : container

        kmm-webhook-server:
            key         : kmm.webhookServer.webhookServer.image
            location    : container://<registry>/rocm/kernel-module-management-webhook-server
            version     : v1.4.1
            kind        : container

        init-container-image:
            key         : commonConfig.initContainerImage
            location    : container://registry.test.pensando.io:5000/busybox
            version     : 1.36
            kind        : container

        dra-driver:
            location    : http://gbt350-odcdh2-a06-1.png-odc.dcgpu:8080/k8s-gpu-dra-driver-helm-k8s-v0.1.0.tgz
            version     : v0.1.0
            kind        : helm-chart

        dra-driver-image:
            key         : image.repository
            location    : container://docker.io/rocm/k8s-gpu-dra-driver
            version     : v0.1.0-alpha.0
            kind        : container

    openshift:
        driver:
            key         : driver.image
            location    : container://image-registry.openshift-image-registry.svc:5000/openshift-amd-gpu/amdgpu_kmod
            kind        : container

        gpu-operator:
            location    : repo://rocm.github.io/gpu-operator:gpu-operator-charts
            version     : v1.4.1
            kind        : helm-chart

        gpu-controller-manager:
            key         : controllerManager.manager.image
            location    : container://<registry>/rocm/gpu-operator
            version     : v1.4.1
            kind        : container

        exporter:
            location    : repo://rocm.github.io/device-metrics-exporter:device-metrics-exporter-charts
            version     : v1.4.1
            kind        : helm-chart

        device-metrics-exporter:
            key         : metricsExporter.image
            location    : container://<registry>/rocm/device-metrics-exporter
            version     : v1.4.1
            kind        : container

        test-runner:
            key         : testRunner.image
            location    : container://<registry>/rocm/test-runner
            version     : v1.4.1
            kind        : container

        config-manager:
            key         : configManager.image
            location    : container://<registry>/rocm/device-config-manager
            version     : v1.4.1
            kind        : container

        device-plugin:
            key         : devicePlugin.devicePluginImage
            location    : container://<registry>/rocm/k8s-device-plugin
            version     : latest
            kind        : container

        node-labeller:
            key         : devicePlugin.nodeLabellerImage
            location    : container://<registry>/rocm/k8s-device-plugin
            version     : labeller-latest
            kind        : container

        kmm-controller-manager-image-sign:
            key         : kmm.controller.manager.env.relatedImageSign
            location    : container://<registry>/rocm/kernel-module-management-signimage
            version     : v1.4.1
            kind        : container

        kmm-controller-manager-worker:
            key         : kmm.controller.manager.env.relatedImageWorker
            location    : container://<registry>/rocm/kernel-module-management-worker
            version     : v1.4.1
            kind        : container

        kmm-controller-manager:
            key         : kmm.controller.manager.image
            location    : container://<registry>/rocm/kernel-module-management-operator
            version     : v1.4.1
            kind        : container

        kmm-webhook-server:
            key         : kmm.webhookServer.webhookServer.image
            location    : container://<registry>/rocm/kernel-module-management-webhook-server
            version     : v1.4.1
            kind        : container

        init-container-image:
            key         : commonConfig.initContainerImage
            location    : container://registry.test.pensando.io:5000/busybox
            version     : 1.36
            kind        : container

